<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.boxSizing = 'border-box';
        div.style.backgroundColor = '#EF4444';
        div.style.color = 'white';
        div.style.padding = '24px';
        div.style.zIndex = '999999';
        div.style.fontFamily = 'monospace';
        div.style.fontSize = '14px';
        div.style.lineHeight = '1.5';
        div.style.overflowY = 'auto';
        div.style.maxHeight = '100vh';
        div.style.boxShadow = '0 10px 15px -3px rgba(0,0,0,0.3)';
        div.innerHTML = '<h2 style="margin:0 0 10px 0;font-size:18px;">❌ Erreur détectée dans le navigateur</h2>' +
          '<p><strong>Message:</strong> ' + message + '</p>' +
          '<p><strong>Fichier:</strong> ' + source + ' (Ligne ' + lineno + ', Col ' + colno + ')</p>' +
          '<pre style="background:rgba(0,0,0,0.2);padding:12px;border-radius:6px;overflow-x:auto;margin:12px 0 0 0;">' + (error && error.stack ? error.stack : 'Pas de trace de pile d\\'exécution') + '</pre>';
        document.body.appendChild(div);
        return false;
      };
    </script>
